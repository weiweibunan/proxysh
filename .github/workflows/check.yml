name: Validate installer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated installer and Bash syntax
        run: |
          node scripts/build.cjs --check
          bash -n argosbx.sh
          for source in lib/*.sh src/*.sh tests/*.sh; do bash -n "$source"; done
      - name: Offline regression tests
        run: |
          bash tests/test-routing.sh
          bash tests/test-releases.sh
          bash tests/test-lifecycle.sh
      - name: Verify real core routing on loopback
        env:
          XRAY_VERSION: 26.10.29
          SINGBOX_VERSION: 1.14.4
        run: |
          export AGSBX_STATE_DIR="$RUNNER_TEMP/argosbx-cores" cpu=amd64
          source lib/releases.sh
          upxray
          upsingbox
          node tests/test-routing-behavior.cjs \
            --xray "$AGSBX_STATE_DIR/xray" \
            --singbox "$AGSBX_STATE_DIR/sing-box" \
            --temp-root "$RUNNER_TEMP"
          node tests/test-routing-behavior.cjs \
            --xray "$AGSBX_STATE_DIR/xray" \
            --singbox "$AGSBX_STATE_DIR/sing-box" \
            --temp-root "$RUNNER_TEMP" --shared true
